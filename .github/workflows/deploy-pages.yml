name: Deploy PurposeFit frontend

# Static demo for GitHub Pages: the front end reads the committed fixtures (web/fixtures),
# which come from the final runs. No API, no data files and no keys are involved.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend (fixtures mode, relative base)
        working-directory: web
        env:
          VITE_USE_FIXTURES: "true"
        run: npm run build

      - name: Add the fixtures to the site
        working-directory: web
        run: |
          cp -R fixtures dist/fixtures
          rm -f dist/fixtures/README.md

      - name: Check that nothing private is published
        run: python3 scripts/check_public_site.py web/dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
