[project]
name = "purposefit"
version = "0.1.0"
description = "Purpose-fit data release compiler for the TrustED PETs proving ground"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.162.2",
    "google-genai>=3.0.0",
    "openai>=3.46.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pycanon>=1.0.1.post2",
    "python-stdnum>=2.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit>=4.7.0",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["vendor", "spike"]

[project.scripts]
purposefit = "api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.bandit]
exclude_dirs = ["tests", "spike", "vendor", ".venv"]
