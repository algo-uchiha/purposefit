[project]
name = "purposefit"
version = "0.1.0"
description = "Purpose-fit data release compiler for the TrustED PETs proving ground"
requires-python = ">=3.11,<3.12"
dependencies = [
    "google-genai>=3.0.0",
    "openai>=3.46.0",
]

[dependency-groups]
dev = ["pytest", "ruff", "openpyxl"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["vendor", "spike"]
